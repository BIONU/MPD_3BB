<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>NUTV Live · สตรีมตรง</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
        }

        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
            cursor: pointer;
        }

        /* UI Overlays */
        .brand-label {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(6px);
            color: #ffcc33;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 6px 14px;
            border-radius: 40px;
            letter-spacing: 1px;
            z-index: 1000;
            font-family: monospace;
            pointer-events: none;
            border-left: 3px solid #ffcc33;
        }

        .control-bar {
            position: absolute;
            bottom: 24px;
            left: 24px;
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 60px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.35s ease;
            border: 1px solid rgba(255,204,51,0.5);
        }

        .volume-bar {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 18px;
            border-radius: 60px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.35s ease;
            border: 1px solid rgba(255,204,51,0.5);
        }

        .control-bar.show, .volume-bar.show {
            opacity: 1;
        }

        .btn {
            background: #111;
            color: white;
            border: 1px solid #ffcc33;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #ffcc33;
            color: #000;
            transform: scale(0.98);
        }

        .vol-btn {
            width: 44px;
            padding: 8px 0;
            text-align: center;
            font-size: 1.3rem;
        }

        .volume-slider {
            width: 110px;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.4);
            border-radius: 5px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #ffcc33;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 2px gold;
        }

        /* loading overlay */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1002;
            color: white;
            gap: 12px;
        }

        .loader-text {
            font-size: 1.5rem;
            font-weight: 500;
        }
        .loader-text:after {
            content: '...';
            animation: dots 1.2s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; opacity: 0.6; }
            40% { content: '..'; opacity: 1; }
            60%, 100% { content: '...'; opacity: 1; }
        }

        /* autoplay block overlay (ซ่อนไว้ก่อน) */
        .block-card {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1005;
            gap: 20px;
            color: white;
            padding: 24px;
        }

        .play-big-btn {
            background: #ffcc33;
            border: none;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            color: #1e1e1e;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
        }
        .play-big-btn:hover {
            background: #ffdd55;
            transform: scale(1.02);
        }
        .small-note {
            font-size: 0.8rem;
            color: #ccc;
            margin-top: 8px;
        }

        @media (max-width: 700px) {
            .control-bar { padding: 5px 12px; gap: 8px; bottom: 16px; left: 16px; }
            .btn { padding: 5px 12px; font-size: 0.7rem; }
            .volume-bar { top: 12px; right: 12px; padding: 4px 12px; gap: 8px; }
            .volume-slider { width: 80px; }
            .brand-label { font-size: 0.9rem; bottom: 12px; right: 12px; }
            .loader-text { font-size: 1.2rem; }
        }

        .fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
<div id="player-container">
    <video id="nutv-video" playsinline webkit-playsinline muted autoplay="false"></video>

    <!-- loading indicator -->
    <div id="loadingSpinner" class="loader-overlay">
        <div class="loader-text">กำลังโหลด NUTV</div>
        <div style="font-size:0.8rem;">สตรีมคุณภาพสูง</div>
    </div>

    <!-- autoplay ถูก block แสดงปุ่ม -->
    <div id="blockScreen" class="block-card">
        <p style="font-size:1.3rem;">🔇 เบราว์เซอร์บล็อกการเล่นอัตโนมัติ</p>
        <p>กรุณากดปุ่มด้านล่างเพื่อเริ่มรับชม</p>
        <button class="play-big-btn" id="forcePlayBtn">▶ เริ่มเล่นสด</button>
        <div class="small-note">*หากยังไม่เล่น คลิกที่หน้าจออีกครั้ง</div>
    </div>

    <div class="brand-label"><span>⚡ NUTV • สด</span></div>

    <div id="controlsPanel" class="control-bar">
        <button class="btn" id="fullscreenBtn">เต็มจอ</button>
        <button class="btn" id="normalScreenBtn">จอปกติ</button>
        <button class="btn" id="autoToggleBtn">เล่นอัตโนมัติ: เปิด</button>
    </div>

    <div id="volumePanel" class="volume-bar">
        <button class="btn vol-btn" id="muteBtn">🔊</button>
        <input type="range" id="volumeRange" class="volume-slider" min="0" max="100" value="100">
    </div>
</div>

<script>
    (function(){
        // ---------- การตั้งค่าสตรีมและ headers ----------
        const STREAM_URL = "https://49-231-34-108-rewriter.ais-vidnt.com/ais/play/anevia/live/eds/TL001/HLS/TL001.m3u8";
        const CUSTOM_HEADERS = {
            "User-Agent": "AISPlay/2.9.17.29 (Linux;Android 11) ExoPlayerLib/2.9.6",
            "Referer": "https://ais-vidnt.com/"
        };

        // DOM elements
        const video = document.getElementById('nutv-video');
        const loadingDiv = document.getElementById('loadingSpinner');
        const blockDiv = document.getElementById('blockScreen');
        const controlsDiv = document.getElementById('controlsPanel');
        const volumeDiv = document.getElementById('volumePanel');
        const fullBtn = document.getElementById('fullscreenBtn');
        const normalBtn = document.getElementById('normalScreenBtn');
        const autoToggle = document.getElementById('autoToggleBtn');
        const muteToggle = document.getElementById('muteBtn');
        const volumeRange = document.getElementById('volumeRange');
        const forcePlayBtn = document.getElementById('forcePlayBtn');
        const container = document.getElementById('player-container');

        // ตัวแปรสถานะ
        let hls = null;
        let autoPlayEnabled = true;      // โหมดเล่นอัตโนมัติ (ถ้า true จะพยายามเล่นใหม่เมื่อติดขัด)
        let isMutedFlag = false;
        let lastVolume = 100;
        let userInteracted = false;       // ใช้เพื่อซ่อน overlay เมื่อผู้ใช้คลิก
        let playPromiseInProgress = false;
        let retryCounter = 0;
        const MAX_RETRIES = 4;

        // ---------- Helper UI ----------
        function showControlsTemporarily() {
            controlsDiv.classList.add('show');
            volumeDiv.classList.add('show');
            if (window.ctrlTimeout) clearTimeout(window.ctrlTimeout);
            window.ctrlTimeout = setTimeout(() => {
                controlsDiv.classList.remove('show');
                volumeDiv.classList.remove('show');
            }, 3200);
        }

        // อัปเดต UI เสียง และ volume จริง
        function updateVolumeUI(value) {
            let vol = Math.min(100, Math.max(0, Number(value)));
            video.volume = vol / 100;
            volumeRange.value = vol;
            if(vol === 0) {
                muteToggle.textContent = '🔇';
                isMutedFlag = true;
            } else if(vol < 50) {
                muteToggle.textContent = '🔈';
                isMutedFlag = false;
            } else {
                muteToggle.textContent = '🔊';
                isMutedFlag = false;
            }
        }

        function setVolumeLevel(level) {
            if(video) {
                video.volume = level / 100;
                updateVolumeUI(level);
            }
        }

        function toggleMuteAction() {
            if(video.volume > 0) {
                lastVolume = video.volume * 100;
                setVolumeLevel(0);
            } else {
                setVolumeLevel(lastVolume > 0 ? lastVolume : 80);
            }
            showControlsTemporarily();
        }

        // ---------- Fullscreen logic ----------
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(e => console.warn(e));
            } else {
                document.exitFullscreen();
            }
        }
        function onFullscreenChange() {
            if (document.fullscreenElement) {
                container.classList.add('fullscreen-mode');
            } else {
                container.classList.remove('fullscreen-mode');
            }
            showControlsTemporarily();
        }
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);

        // ---------- ฟังก์ชันหลัก: เล่นสตรีมด้วย HLS.js + custom headers ----------
        function destroyHls() {
            if(hls) {
                try {
                    hls.destroy();
                } catch(e) {}
                hls = null;
            }
        }

        // พยายามเล่น autoplay ด้วย video element (ต้อง muted = true)
        function attemptAutoPlayVideo() {
            if(!video) return Promise.reject("no video");
            // ถ้ากำลังเล่นอยู่แล้วไม่ต้องทำ
            if(!video.paused) return Promise.resolve(true);
            const playPromise = video.play();
            if(playPromise) {
                return playPromise.then(() => {
                    // เล่นสำเร็จ
                    if(loadingDiv) loadingDiv.style.display = 'none';
                    if(blockDiv) blockDiv.style.display = 'none';
                    userInteracted = true;
                    return true;
                }).catch(err => {
                    console.warn("Autoplay failed (expected if no gesture):", err);
                    // แสดง overlay เฉพาะเมื่อ autoPlayEnabled == true และยังไม่เคยซ่อน
                    if(autoPlayEnabled && blockDiv && blockDiv.style.display !== 'flex') {
                        blockDiv.style.display = 'flex';
                        if(loadingDiv) loadingDiv.style.display = 'none';
                    }
                    return false;
                });
            }
            return Promise.resolve(false);
        }

        // เริ่มต้น / รีเซ็ตตัวเล่น HLS
        function initHlsStream() {
            destroyHls();
            if(!Hls.isSupported()) {
                // fallback native HLS (Safari)
                if(video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = STREAM_URL;
                    video.addEventListener('loadedmetadata', () => {
                        if(loadingDiv) loadingDiv.style.display = 'none';
                        if(autoPlayEnabled) attemptAutoPlayVideo();
                    });
                    video.addEventListener('error', () => {
                        if(autoPlayEnabled && blockDiv) blockDiv.style.display = 'flex';
                    });
                } else {
                    if(blockDiv) blockDiv.style.display = 'flex';
                    if(loadingDiv) loadingDiv.style.display = 'none';
                }
                return;
            }

            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                maxBufferLength: 30,
                backBufferLength: 60,
                xhrSetup: function(xhr, url) {
                    xhr.setRequestHeader('User-Agent', CUSTOM_HEADERS['User-Agent']);
                    xhr.setRequestHeader('Referer', CUSTOM_HEADERS['Referer']);
                    // ป้องกัน preflight ไม่ต้อง withCredentials
                },
                debug: false
            });

            hls.attachMedia(video);
            hls.loadSource(STREAM_URL);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                console.log("✅ HLS Manifest loaded");
                retryCounter = 0;
                if(loadingDiv) loadingDiv.style.display = 'none';
                // ถ้า autoPlayEnabled และไม่ได้อยู่ใน overlay บังคับ ให้พยายามเล่นอัตโนมัติทันที
                if(autoPlayEnabled && blockDiv.style.display !== 'flex') {
                    attemptAutoPlayVideo().then(success => {
                        if(!success && autoPlayEnabled) {
                            // แสดงปุ่มให้กด
                            if(blockDiv) blockDiv.style.display = 'flex';
                        }
                    });
                } else if(autoPlayEnabled && blockDiv.style.display === 'flex') {
                    // ยังมี overlay อยู่ รอ user กดปุ่ม
                }
                showControlsTemporarily();
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if(data.fatal) {
                    console.error("HLS Fatal error:", data);
                    if(data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        if(autoPlayEnabled && retryCounter < MAX_RETRIES) {
                            retryCounter++;
                            setTimeout(() => {
                                if(loadingDiv) loadingDiv.style.display = 'flex';
                                initHlsStream();
                            }, 3000);
                        } else {
                            if(blockDiv && autoPlayEnabled) blockDiv.style.display = 'flex';
                            if(loadingDiv) loadingDiv.style.display = 'none';
                        }
                    } else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        hls.recoverMediaError();
                    } else {
                        if(autoPlayEnabled && retryCounter < MAX_RETRIES) {
                            retryCounter++;
                            setTimeout(() => initHlsStream(), 4000);
                        } else {
                            if(blockDiv) blockDiv.style.display = 'flex';
                            if(loadingDiv) loadingDiv.style.display = 'none';
                        }
                    }
                } else {
                    // non-fatal (เช่น buffer stall) ลองเรียกเล่นอีกครั้งถ้าจำเป็น
                    if(autoPlayEnabled && video && video.paused && blockDiv.style.display !== 'flex') {
                        attemptAutoPlayVideo();
                    }
                }
            });

            // event เมื่อเล่นจริงให้ซ่อน overlay ทั้งหมด
            video.addEventListener('play', () => {
                if(loadingDiv) loadingDiv.style.display = 'none';
                if(blockDiv) blockDiv.style.display = 'none';
                userInteracted = true;
                showControlsTemporarily();
            });
            
            video.addEventListener('pause', () => { /* อาจใช้สำหรับ debug */ });
            
            // เวลามี waiting และ autoplay เปิด ให้ลองกระตุ้นอีกครั้ง (กรณี buffer empty)
            video.addEventListener('waiting', () => {
                if(autoPlayEnabled && video.paused && !blockDiv.style.display === 'flex') {
                    attemptAutoPlayVideo();
                }
            });
        }

        // ---------- Manual Play (เมื่อกดปุ่ม หรือคลิกที่วิดีโอ) ----------
        function forcePlayStream() {
            if(blockDiv) blockDiv.style.display = 'none';
            if(loadingDiv) loadingDiv.style.display = 'flex';
            userInteracted = true;
            
            // ถ้า hls ไม่มี หรือถูก destroy ให้สร้างใหม่
            if(!hls && Hls.isSupported()) {
                initHlsStream();
                // รอ manifest แล้ว video.play() จะถูกเรียกใน manifest parsed อีกที
                setTimeout(() => {
                    if(video && video.paused && autoPlayEnabled) {
                        attemptAutoPlayVideo();
                    }
                }, 600);
            } else if(hls) {
                // มี hls อยู่แล้วแค่เรียกเล่น
                attemptAutoPlayVideo().then(success => {
                    if(!success && blockDiv) blockDiv.style.display = 'flex';
                    if(loadingDiv) loadingDiv.style.display = 'none';
                });
            } else if(video) {
                // native fallback
                video.load();
                attemptAutoPlayVideo();
            }
            showControlsTemporarily();
        }

        // เมื่อผู้ใช้คลิกที่หน้าจอวิดีโอ (ช่วย autoplay)
        function onVideoClickHandler() {
            if(!userInteracted) {
                forcePlayStream();
            } else {
                // ถ้ากำลังเล่นอยู่แล้วแค่แสดง controls
                showControlsTemporarily();
                // ถ้าวิดีโอหยุดและ autoplay เปิด ลองเล่นต่อ
                if(autoPlayEnabled && video.paused && blockDiv.style.display !== 'flex') {
                    video.play().catch(e=>console.log("click play err", e));
                }
            }
        }

        // ---------- Toggle AutoPlay Mode ----------
        function toggleAutoPlay() {
            autoPlayEnabled = !autoPlayEnabled;
            autoToggle.textContent = autoPlayEnabled ? 'เล่นอัตโนมัติ: เปิด' : 'เล่นอัตโนมัติ: ปิด';
            if(autoPlayEnabled) {
                // ถ้าเปิดอัตโนมัติ แล้ววิดีโอหยุดอยู่ ให้พยายามเล่นใหม่
                if(video && video.paused && !blockDiv.style.display === 'flex') {
                    attemptAutoPlayVideo();
                }
                // ตรวจสอบว่าถ้า hls เสียให้รีโหลด
                if((!hls || (hls && video.error)) && !blockDiv.style.display === 'flex') {
                    initHlsStream();
                }
            } else {
                // ปิด autoplay: ไม่ทำอะไรเพิ่ม
            }
            showControlsTemporarily();
        }
        
        // ---------- ตรวจจับ visibility (กลับมาแท็บ) ----------
        document.addEventListener('visibilitychange', () => {
            if(!document.hidden && autoPlayEnabled && video && video.paused && blockDiv.style.display !== 'flex') {
                attemptAutoPlayVideo();
            }
        });

        // ตรวจสอบสตรีมหลุดเป็นระยะ (watchdog)
        let watchInterval = null;
        function startWatchDog() {
            if(watchInterval) clearInterval(watchInterval);
            watchInterval = setInterval(() => {
                if(autoPlayEnabled && video && video.paused && !userInteracted && blockDiv.style.display !== 'flex') {
                    // ถ้ายังไม่มี user interaction และ autoplay เปิด ให้ลองเล่นเบาๆ (ถ้าไม่ได้จะแสดง overlay)
                    attemptAutoPlayVideo();
                } else if(autoPlayEnabled && video && video.paused && blockDiv.style.display !== 'flex' && userInteracted) {
                    // user เคยคลิกแล้ว แต่หยุดกะทันหัน ให้ลองเล่นใหม่
                    video.play().catch(()=>{});
                }
                // หยุดทำงาน? ตรวจสอบ readyState
                if(video && video.networkState === 2 && video.readyState === 0 && autoPlayEnabled && !blockDiv.style.display) {
                    console.log("watchdog: stream dead, restart");
                    initHlsStream();
                }
            }, 18000);
        }

        // ---------- Bind Events & UI ----------
        fullBtn.addEventListener('click', () => { toggleFullscreen(); showControlsTemporarily(); });
        normalBtn.addEventListener('click', () => { if(document.fullscreenElement) document.exitFullscreen(); showControlsTemporarily(); });
        autoToggle.addEventListener('click', toggleAutoPlay);
        muteToggle.addEventListener('click', () => { toggleMuteAction(); showControlsTemporarily(); });
        volumeRange.addEventListener('input', (e) => { setVolumeLevel(parseInt(e.target.value,10)); showControlsTemporarily(); });
        forcePlayBtn.addEventListener('click', forcePlayStream);
        video.addEventListener('click', onVideoClickHandler);
        
        // แสดง controls เมื่อเมาส์/แตะใกล้ขอบ
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const y = e.clientY - rect.top;
            if(rect.height - y < 100) showControlsTemporarily();
        });
        container.addEventListener('touchstart', () => showControlsTemporarily());

        // จัดการ volume เริ่มต้น muted = true แต่อยู่ในเงื่อนไข autoplay
        video.muted = true;   // บังคับ muted สำหรับ autoplay
        updateVolumeUI(100);   // เสียงในระบบ 100% แต่เนื่องจาก muted จริงจึงไม่มีเสียง แต่ volume level ใน video ยัง 1
        // เมื่อผู้ใช้กดปุ่ม mute จะเป็นการ unmute ได้ (toggleMuteAction จะปรับ video.muted = false)
        // แก้ toggleMute ให้ทำงานร่วมกับ muted property
        const originalToggleMute = toggleMuteAction;
        window.toggleMuteAction = function() {
            if(video.muted) {
                video.muted = false;
                if(video.volume === 0) setVolumeLevel(50);
                updateVolumeUI(video.volume * 100);
            } else {
                if(video.volume > 0) {
                    lastVolume = video.volume * 100;
                    setVolumeLevel(0);
                } else {
                    setVolumeLevel(lastVolume > 0 ? lastVolume : 70);
                }
            }
            showControlsTemporarily();
        };
        muteToggle.onclick = () => { window.toggleMuteAction(); };
        
        // override setVolumeLevel ให้ปรับ muted ถ้าจำเป็น
        const superSetVolume = setVolumeLevel;
        setVolumeLevel = function(level) {
            let volVal = Math.min(100, Math.max(0, level));
            video.volume = volVal / 100;
            if(video.muted && volVal > 0) video.muted = false;
            volumeRange.value = volVal;
            if(volVal === 0) muteToggle.textContent = '🔇';
            else if(volVal < 50) muteToggle.textContent = '🔈';
            else muteToggle.textContent = '🔊';
        };
        window.setVolumeLevel = setVolumeLevel;
        setVolumeLevel(100);
        
        // เริ่มต้นสตรีม
        initHlsStream();
        startWatchDog();
        
        // สำรอง: ถ้าหลังจากโหลด 2.5 วิแล้วยังไม่เล่นและไม่มี overlay ให้ลอง autoplay อีกครั้ง
        setTimeout(() => {
            if(autoPlayEnabled && video && video.paused && blockDiv.style.display !== 'flex' && loadingDiv.style.display !== 'none') {
                attemptAutoPlayVideo();
            }
        }, 2500);
        
        // ถ้า video หยุดเพราะ error และ autoplay เปิด -> รีสตาร์ท
        video.addEventListener('error', () => {
            if(autoPlayEnabled && !blockDiv.style.display) {
                setTimeout(() => {
                    if(hls) initHlsStream();
                    else video.load();
                }, 2000);
            }
        });
        
        // ป้องกัน context menu บนวิดีโอ
        video.addEventListener('contextmenu', (e) => e.preventDefault());
    })();
</script>
</body>
</html>
